name: PR quality gate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: checks-android
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev libwebkit2gtk-4.1-dev librsvg2-dev pkg-config

      - name: Install latest stable Rust and Clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          # Node 24 applies --test-timeout to each test, rather than the file wrapper.
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks and tests
        run: pnpm run check

  android-cargo-check:
    name: cargo-check-android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install latest stable Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Configure Android compiler
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          toolchain="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          sysroot="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          {
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
            echo "AR_aarch64_linux_android=$toolchain/llvm-ar"
            echo "CC_aarch64_linux_android=$toolchain/aarch64-linux-android24-clang"
            echo "CXX_aarch64_linux_android=$toolchain/aarch64-linux-android24-clang++"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$toolchain/aarch64-linux-android24-clang"
            echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--sysroot=$sysroot"
          } >> "$GITHUB_ENV"

      - name: Check Android Rust target
        run: >-
          cargo check
          --manifest-path src-tauri/Cargo.toml
          -p tauritavern
          --target aarch64-linux-android
          --no-default-features
