name: PR target branch

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read

jobs:
  check-target:
    runs-on: ubuntu-latest
    steps:
      - name: Validate target branch
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          case "$TARGET_BRANCH" in
            dev) echo "Regular development targets dev." ;;
            main) echo "Stable baseline changes require reviewed release promotion or an urgent-fix review; see docs/PersonalDevelopment.md." ;;
            *) echo "::error::Pull requests must target dev or main."; exit 1 ;;
          esac
