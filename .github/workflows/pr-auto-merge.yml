name: PR auto-merge

on:
  workflow_run:
    workflows: ["PR quality gate"]
    types: [completed]

permissions: {}

concurrency:
  group: pr-auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  auto-merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Request protected auto-merge
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TESTED_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # A commit already on main resolves to its merged PR, not an open promotion.
          pr_numbers=$(gh api "repos/$GITHUB_REPOSITORY/pulls" \
            --method GET -f state=open -f "head=$REPOSITORY_OWNER:$SOURCE_BRANCH" \
            --paginate --jq '.[].number')
          if [[ -z "$pr_numbers" ]]; then
            echo "No open pull requests use the tested source branch."
            exit 0
          fi

          while IFS= read -r pr_number; do
            pr=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" \
              --json state,isDraft,author,isCrossRepository,baseRefName,headRefName,headRefOid,autoMergeRequest)
            eligibility=$(jq -r --arg owner "$REPOSITORY_OWNER" --arg head "$TESTED_HEAD" '
              if .state != "OPEN" or .isDraft or .isCrossRepository or
                 .author.login != $owner or .headRefOid != $head or
                 (.baseRefName != "dev" and .baseRefName != "main")
              then "ineligible"
              elif .autoMergeRequest != null then "enabled"
              else "ready"
              end' <<< "$pr")
            case "$eligibility" in
              ineligible)
                echo "PR #$pr_number is no longer eligible for this tested commit."
                ;;
              enabled)
                echo "PR #$pr_number already has native auto-merge enabled."
                ;;
              ready)
                # Maintained branches must retain each other's ancestry.
                merge_method=$(jq -r '
                  if (.headRefName == "dev" and .baseRefName == "main") or
                     (.headRefName == "main" and .baseRefName == "dev")
                  then "--merge"
                  else "--squash"
                  end' <<< "$pr")
                gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" \
                  --auto "$merge_method" --match-head-commit "$TESTED_HEAD"
                ;;
            esac
          done <<< "$pr_numbers"
